name: Spring boot CD
on:
  workflow_run:
    workflows: ["Spring boot CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Docker
    if: >
        ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: spring-boot-app
          path: target

      - name: checkout sourcecode
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/spring-app:${{ github.event.workflow_run.head_sha }} \ 
          -t ${{ secrets.DOCKER_USERNAME }}/spring-app:latest .

      - name: push docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:${{ github.event.workflow_run.head_sha }} 
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:latest 
